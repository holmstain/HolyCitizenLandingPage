server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Gzip sıkıştırması
    gzip on;
    gzip_types text/html text/css text/plain application/javascript application/json;

    # Ana sayfa ve statik varlıklar
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Önbellekleme: CSS/JS/img için uzun süreli, JSON (dil dosyaları) için kısa
    location ~* \.(css|js|ico|png|jpg|jpeg|svg|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    location ~* \.json$ {
        expires 1h;
        add_header Cache-Control "public";
    }

    # Güvenlik başlıkları
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;

    # 404'da SPA fallback (tek sayfalık landing page)
    error_page 404 /index.html;
    location = /index.html {
        internal;
    }

    # Aşağıdaki bloklar istenirse Kick botunun panelini/webhook'unu
    # nginx'in arkasına almak için açıp sunucu alan adına göre ayarlanabilir.
